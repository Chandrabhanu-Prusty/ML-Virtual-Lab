<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="planeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#312e81" stop-opacity="0.3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Projection Plane (2D manifold) -->
  <polygon points="6,34 26,42 42,32 22,24" fill="url(#planeGrad)" stroke="#6366f1" stroke-width="1.2" stroke-dasharray="2 2" opacity="0.85" />
  
  <!-- High-Dimensional Cube / Projection Lines -->
  <!-- Top 3D Cube -->
  <polygon points="24,6 36,13 24,20 12,13" fill="url(#primaryGrad)" fill-opacity="0.35" stroke="#a78bfa" stroke-width="1.5" />
  <polygon points="12,13 24,20 24,31 12,24" fill="url(#accentGrad)" fill-opacity="0.25" stroke="#818cf8" stroke-width="1.5" />
  <polygon points="36,13 24,20 24,31 36,24" fill="url(#primaryGrad)" fill-opacity="0.45" stroke="#c084fc" stroke-width="1.5" />

  <!-- Projection Rays from 3D to 2D Plane -->
  <line x1="12" y1="24" x2="14" y2="34" stroke="#a855f7" stroke-width="1" stroke-dasharray="1.5 2" opacity="0.7" />
  <line x1="24" y1="31" x2="25" y2="36" stroke="#6366f1" stroke-width="1" stroke-dasharray="1.5 2" opacity="0.7" />
  <line x1="36" y1="24" x2="34" y2="31" stroke="#38bdf8" stroke-width="1" stroke-dasharray="1.5 2" opacity="0.7" />

  <!-- High-D Data Points -->
  <circle cx="24" cy="6" r="2.2" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="12" cy="13" r="1.8" fill="#ec4899" />
  <circle cx="36" cy="13" r="1.8" fill="#a855f7" />
  <circle cx="24" cy="20" r="2" fill="#c084fc" />

  <!-- Projected Clusters on Lower-D Plane -->
  <!-- Benign Cluster (Cyan/Blue) -->
  <circle cx="18" cy="33" r="2" fill="#10b981" filter="url(#glow)" />
  <circle cx="15" cy="35" r="1.5" fill="#34d399" />
  <circle cx="21" cy="34" r="1.6" fill="#059669" />

  <!-- Malignant Cluster (Pink/Magenta) -->
  <circle cx="31" cy="30" r="2.2" fill="#f43f5e" filter="url(#glow)" />
  <circle cx="28" cy="32" r="1.6" fill="#fb7185" />
  <circle cx="34" cy="33" r="1.5" fill="#e11d48" />

  <!-- Center Transformation Spark -->
  <circle cx="24" cy="31" r="1.2" fill="#ffffff" />
</svg>
